name: Update All AUR Packages

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:
    inputs:
      push:
        description: 'Push changes to AUR (set to false for dry-run)'
        required: true
        type: boolean
        default: true

jobs:
  parse-packages:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    outputs:
      matrix: ${{ steps.output-matrix.outputs.matrix }}
    steps:
      - name: Checkout updater repo
        uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Parse packages.yml into JSON matrix
        run: |
          yq -o=json eval '{"include": .packages}' packages.yml | tr -d '\n' > matrix.json

      - name: Log Generated Matrix for Debugging
        run: |
          echo "=== Generated Matrix JSON ==="
          cat matrix.json
          echo ""

      - name: Set Matrix Output
        id: output-matrix
        run: echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  update-package:
    needs: parse-packages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.parse-packages.outputs.matrix) }}
    env:
      PUSH_CHANGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.push || 'true' }}
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git jq curl pacman-contrib openssh sudo

      - name: Configure SSH for AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "ERROR: AUR_SSH_KEY secret is empty or not accessible by the workflow!"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          
          echo "SSH Key successfully written. Fingerprint:"
          ssh-keygen -lf ~/.ssh/aur_key || true

      - name: Checkout updater scripts repo
        uses: actions/checkout@v7
        with:
          path: updater-repo

      - name: Clone AUR Package Repository
        run: |
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o StrictHostKeyChecking=no" \
            git clone ssh://aur@aur.archlinux.org/${{ matrix.name }}.git pkg-repo

      - name: Create builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder pkg-repo

      - name: Run Update Script & Check for Changes
        id: check-updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_CHECKSUM: ${{ matrix.update_checksum }}
          UPSTREAM_REPO: ${{ matrix.upstream_repo }}
        run: |
          su builder -c "cd pkg-repo && bash ../updater-repo/scripts/${{ matrix.script }} '${{ matrix.name }}'"
          
          su builder -c "
            cd pkg-repo && \
            if git diff --quiet && git diff --staged --quiet; then
              echo 'updated=false'
            else
              echo 'updated=true'
            fi
          " >> $GITHUB_OUTPUT

      - name: Build Test Package
        if: steps.check-updates.outputs.updated == 'true'
        run: |
          cd pkg-repo
          su builder -c "makepkg -s --noconfirm -f"

      - name: Re-own repo as root 
        run: |
          chown -R root:root pkg-repo

      - name: Commit changes locally
        if: steps.check-updates.outputs.updated == 'true'
        run: |
          cd pkg-repo
          git config user.name "AUR Bot"
          git config user.email "aur-bot@s-mc.io"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to latest upstream release

          Automaticly updated by ${{ github.repository }}"

      - name: Push changes to AUR
        if: steps.check-updates.outputs.updated == 'true'
        run: |
          cd pkg-repo
          if [ "$PUSH_CHANGES" = "true" ]; then
            echo "Pushing changes to AUR..."
            GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o StrictHostKeyChecking=no" git push origin master
          else
            echo "Dry-run mode: Skipping push to AUR as requested."
          fi

  trigger-readme-update:
    needs: update-package
    if: needs.prepare-readme-trigger.outputs.should_run == 'true'
    uses: ./.github/workflows/update-readme.yml
    permissions:
      contents: write
